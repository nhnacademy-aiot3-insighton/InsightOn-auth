# dev 프로파일에서만 다른 설정. 공통 설정은 application.properties 참고.
spring.config.import=classpath:config/dev/redis.properties, classpath:config/dev/db.properties, classpath:config/dev/mail.properties, classpath:config/dev/zipkin.properties, classpath:config/dev/oauth.properties

server.port=8000

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.root=INFO
logging.level.com.nhnacademy.insightonauth=DEBUG