# prod 프로파일에서만 다른 설정. 공통 설정은 application.properties 참고.

spring.config.import=classpath:config/prod/actuator.properties, classpath:config/prod/redis.properties, classpath:config/prod/db.properties, classpath:config/prod/mail.properties, classpath:config/prod/zipkin.properties, classpath:config/prod/oauth.properties

spring.jpa.show-sql=false
service-url.core=http://insighton-core

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.root=INFO