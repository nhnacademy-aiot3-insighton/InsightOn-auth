spring.application.name=insighton-auth

management.endpoints.web.exposure.include=health,prometheus

# ===============================
# jwt token keys
# ===============================
jwt.private-key=${JWT_PRIVATE_KEY}
jwt.public-key=${JWT_PUBLIC_KEY}
jwt.key-id=monitoring-key-v1
jwt.access-token-validity=15m
jwt.refresh-token-validity=15d

# ===============================
# Resilience4j
# ===============================
spring.cloud.openfeign.circuitbreaker.enabled=true

# Feign이 생성하는 CB 이름(CoreClient#메서드(파라미터))과 인스턴스 이름 매칭이
# 까다로워, 이름 무관하게 적용되는 configs.default로 공통 정책 설정
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
