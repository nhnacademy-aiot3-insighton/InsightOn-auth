spring.application.name=insighton-auth

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details: always

# ===============================
# JPA
# ===============================
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# jwt token keys
# ===============================
jwt.private-key=${JWT_PRIVATE_KEY}
jwt.public-key=${JWT_PUBLIC_KEY}
jwt.key-id=monitoring-key-v1
jwt.access-token-validity=15m
jwt.refresh-token-validity=14d

# 타임아웃
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 발신 이메일 주소 (코드에서 참조용)
mail.from-address=insighton@insighton.store
mail.from-name=InsightOn

# ===============================
# OAuth - Google
# ===============================
oauth.google.client-id=${GOOGLE_CLIENT_ID}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET}
oauth.redirect-uri=https://insighton.store/oauth/callback

# ===============================
# OAuth - GitHub
# ===============================
oauth.github.client-id=${GITHUB_CLIENT_ID}
oauth.github.client-secret=${GITHUB_CLIENT_SECRET}

# ===============================
# Resilience4j
# ===============================
spring.cloud.openfeign.circuitbreaker.enabled=true

# Feign이 생성하는 CB 이름(CoreClient#메서드(파라미터))과 인스턴스 이름 매칭이
# 까다로워, 이름 무관하게 적용되는 configs.default로 공통 정책 설정
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
