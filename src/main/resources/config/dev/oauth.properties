# ===============================
# OAuth - Google
# ===============================
oauth.google.client-id=${GOOGLE_CLIENT_ID}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET}

# ===============================
# OAuth - GitHub
# ===============================
oauth.github.client-id=${GITHUB_CLIENT_ID}
oauth.github.client-secret=${GITHUB_CLIENT_SECRET}

# 로컬 — auth 콜백(8000) = provider 콘솔 등록값. 프론트는 8400.
oauth.redirect-uri=http://localhost:8000/api/v1/auth/oauth/callback
app.front-url=http://localhost:8400
# 로컬은 http라 Secure 쿠키를 끈다 (localhost 밖 dev 호스트에서 state 쿠키 유실 방지)
app.cookie.secure=false