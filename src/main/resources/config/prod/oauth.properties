# ===============================
# OAuth - Google
# ===============================
oauth.google.client-id=${GOOGLE_CLIENT_ID}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET}

# ===============================
# OAuth - GitHub
# ===============================
oauth.github.client-id=${GITHUB_CLIENT_ID}
oauth.github.client-secret=${GITHUB_CLIENT_SECRET}

# authorize·code교환·토큰발급을 전부 auth 가 한다. redirect-uri 는 auth 콜백 = provider 콘솔 등록값.
oauth.redirect-uri=https://insighton.store/api/v1/auth/oauth/callback
# 로그인 완료/실패 후 브라우저를 돌려보낼 프론트 주소
app.front-url=https://insighton.store
# https 라 Secure 쿠키 사용
app.cookie.secure=true