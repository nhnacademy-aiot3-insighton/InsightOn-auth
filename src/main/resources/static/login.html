<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<h1>로그인</h1>

<form method="POST" action="/auth/v1/auth/login">
    <div>
        <label>이메일</label>
        <input type="email" id="email" placeholder="test@example.com">
    </div>
    <div>
        <label>비밀번호</label>
        <input type="password" id="password">
    </div>
    <button type="submit">로그인</button>
</form>
</body>
</html>
