<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SingUp</title>
</head>
<body>
<h1>회원가입</h1>
<form method="POST" action="api/auth/v1/auth/signup">
    <div>
        <label>이메일</label>
        <input type="email" id="email" placeholder="test@example.com">
    </div>
    <div>
        <label>비밀번호</label>
        <input type="password" id="password" placeholder="영문·숫자·특수문자 포함 8자 이상">
    </div>
    <div>
        <label>이름</label>
        <input type="text" id="userName">
    </div>
    <div>
        <label>전화번호</label>
        <input type="tel" id="phoneNumber" placeholder="01012345678">
    </div>

    <button type="submit">회원가입</button>
</form>
</body>
</html>
